<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <rect width="1600" height="400" fill="#0b1020"/>
  
  <!-- Left accent line -->
  <rect x="0" y="0" width="4" height="400" fill="#1a2a4a"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a4a" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1600" height="400" fill="url(#grid)" />
  
  <!-- Main title -->
  <text x="800" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="64" fill="#e2e2e2" text-anchor="middle" font-weight="bold">
    Hermes-Plugin-Pack
  </text>
  
  <!-- Subtitle -->
  <text x="800" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#a0a0a0" text-anchor="middle">
    Plugins for Hermes Agent: feedback journal, skill drafting, proot sandbox, verbatim context compaction
  </text>
</svg>