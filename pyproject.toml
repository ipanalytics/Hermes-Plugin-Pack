# This repository is a collection of plugins, not a Python distribution.
# A plugin is loaded by the host from $HERMES_HOME/plugins/<name>, so there is
# nothing to package or publish; the tables below configure the test and lint
# tools only.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# E501: long lines are a style choice, not a bug. RUF001: we print "×3" in reports on purpose.
ignore = ["E501", "RUF001"]
